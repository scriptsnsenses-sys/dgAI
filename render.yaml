services:
  - type: web
    name: dgai-converse-1-3
    runtime: python
    plan: 2c-8g
    buildCommand: pip install --upgrade pip && pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: gunicorn server:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: model-cache
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MODEL_REPO
        value: dgAI202/Converse-1.3
      - key: MODEL_FILE
        value: model.safetensors
      - key: MODEL_REVISION
        value: 29efcd5a8fd2f55b727f06a8b636fb825bcbd4b3
      - key: MODEL_CONTEXT
        value: "32768"
      - key: MODEL_THREADS
        value: "2"
      - key: MODEL_SIZE_BYTES
        value: "3098907121"
      - key: HF_HOME
        value: /var/data/huggingface
      - key: HF_HUB_DISABLE_XET
        value: "1"
