<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfa">
  <meta name="description" content="A thoughtful space to think, make, and explore with Converse 1.3 by dgAI.">
  <title>dgAI — Converse</title>
  <style>
    :root {
      color-scheme: light;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --bg: #f6f6f4;
      --rail: rgba(255,255,255,0.58);
      --surface: rgba(255,255,255,0.72);
      --surface-2: rgba(255,255,255,0.55);
      --hover: rgba(255,255,255,0.85);
      --line: rgba(255,255,255,0.65);
      --line-2: rgba(20,20,25,0.08);
      --ink: #141416;
      --ink-2: #3f4145;
      --muted: #7a7c80;
      --faint: #a1a3a6;
      --bubble: rgba(255,255,255,0.75);
      --accent: #4f5bd5;
      --accent-2: #8b5cf6;
      --accent-3: #06b6d4;
      --glass: rgba(255,255,255,0.52);
      --glass-strong: rgba(255,255,255,0.82);
      --glass-border: rgba(255,255,255,0.75);
      --glass-shadow: 0 8px 32px rgba(20,20,25,0.08), 0 1px 0 rgba(255,255,255,0.6) inset;
      --shadow-sm: 0 1px 2px rgba(20,20,25,.05), 0 1px 0 rgba(255,255,255,.6) inset;
      --shadow-md: 0 12px 32px -12px rgba(20,20,25,.14), 0 1px 2px rgba(20,20,25,.05);
      --shadow-lg: 0 24px 64px -24px rgba(20,20,25,.22), 0 2px 8px rgba(20,20,25,.06);
      --grad: linear-gradient(135deg, #4f5bd5 0%, #8b5cf6 48%, #06b6d4 100%);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e0f12;
      --rail: rgba(22,23,27,0.58);
      --surface: rgba(28,29,34,0.62);
      --surface-2: rgba(255,255,255,0.06);
      --hover: rgba(255,255,255,0.08);
      --line: rgba(255,255,255,0.09);
      --line-2: rgba(255,255,255,0.12);
      --ink: #f2f2f3;
      --ink-2: #c6c8cd;
      --muted: #8b8d93;
      --faint: #6f7178;
      --bubble: rgba(255,255,255,0.08);
      --accent: #8b93ff;
      --accent-2: #a78bfa;
      --accent-3: #22d3ee;
      --glass: rgba(28,29,34,0.48);
      --glass-strong: rgba(28,29,34,0.78);
      --glass-border: rgba(255,255,255,0.14);
      --glass-shadow: 0 8px 32px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.08) inset;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 12px 32px -12px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.4);
      --shadow-lg: 0 24px 64px -24px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.4);
      --grad: linear-gradient(135deg, #8b93ff 0%, #a78bfa 48%, #22d3ee 100%);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-width: 320px;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
    }
    /* Aurora backdrop - soft, not loud */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(640px 420px at 12% -10%, rgba(79,91,213,.18), transparent 60%),
        radial-gradient(720px 460px at 88% 0%, rgba(139,92,246,.16), transparent 62%),
        radial-gradient(800px 520px at 50% 110%, rgba(6,182,212,.12), transparent 62%);
    }
    [data-theme="dark"] body::before {
      background:
        radial-gradient(640px 420px at 12% -10%, rgba(139,147,255,.22), transparent 60%),
        radial-gradient(720px 460px at 88% 0%, rgba(167,139,250,.18), transparent 62%),
        radial-gradient(800px 520px at 50% 110%, rgba(34,211,238,.14), transparent 62%);
    }
    button, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    ::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .app { display: grid; grid-template-columns: 282px minmax(0, 1fr); height: 100vh; height: 100dvh; position: relative; z-index: 1; }
    /* ── Sidebar - glass ── */
    .sidebar {
      position: relative; display: flex; min-height: 0; flex-direction: column;
      padding: 18px 14px 14px;
      border-right: 1px solid var(--glass-border);
      background: var(--rail);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      box-shadow: 1px 0 0 rgba(255,255,255,.4) inset;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; color: inherit; text-decoration: none; }
    .brand-mark {
      display: grid; width: 32px; height: 32px; flex: 0 0 32px; place-items: center;
      border-radius: 10px;
      background: var(--grad);
      color: #fff; font-size: 11px; font-weight: 750; letter-spacing: -.06em; padding-right: 1px;
      box-shadow: 0 8px 20px rgba(79,91,213,.35), 0 1px 0 rgba(255,255,255,.3) inset;
    }
    .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -.03em; }
    .brand-name small { display: block; margin-top: 1px; color: var(--muted); font-size: 9px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    .new-chat {
      display: flex; height: 42px; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid rgba(255,255,255,.45); border-radius: 12px;
      background: linear-gradient(135deg, #141416 0%, #2a2b32 55%, #4f5bd5 100%);
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      box-shadow: 0 10px 24px rgba(20,20,25,.18), 0 1px 0 rgba(255,255,255,.18) inset;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    [data-theme="dark"] .new-chat { background: linear-gradient(135deg, #fff 0%, #e6e7ff 60%, #8b93ff 100%); color: #141416; }
    .new-chat:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 14px 28px rgba(20,20,25,.22); }
    .new-chat:active { transform: translateY(0); }
    .new-chat svg { width: 15px; height: 15px; }
    .section-label { margin: 22px 10px 8px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .history { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 3px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; padding-bottom: 4px; }
    .history-empty { padding: 10px; color: var(--faint); font-size: 12px; line-height: 1.6; }
    .history-row {
      display: flex; min-width: 0; align-items: center; gap: 2px; padding: 1px 3px 1px 10px;
      border: 1px solid transparent; border-radius: 10px; color: var(--ink-2);
      transition: background .15s ease, border-color .15s ease, backdrop-filter .15s ease;
    }
    .history-row:hover { background: var(--hover); }
    .history-row.active {
      border-color: var(--glass-border);
      background: var(--glass-strong);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      color: var(--ink); box-shadow: var(--glass-shadow);
    }
    .history-select { min-width: 0; flex: 1; overflow: hidden; padding: 8px 0; border: 0; background: none; color: inherit; font-size: 13px; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .delete-chat { display: grid; width: 26px; height: 26px; flex: 0 0 26px; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); opacity: 0; cursor: pointer; transition: background .15s ease, color .15s ease, opacity .15s ease; }
    .history-row:hover .delete-chat, .history-row.active .delete-chat, .delete-chat:focus-visible { opacity: 1; }
    .delete-chat:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
    .delete-chat svg { width: 14px; height: 14px; }
    .sidebar-bottom { padding-top: 12px; border-top: 1px solid var(--line); }
    .side-link { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-size: 12.5px; transition: background .15s ease, color .15s ease; }
    .side-link:hover { background: var(--hover); color: var(--ink); }
    .side-link svg { width: 15px; height: 15px; color: var(--muted); }
    .rail-caption { padding: 10px 10px 2px; color: var(--faint); font-size: 10.5px; letter-spacing: .01em; }
    /* ── Main / Topbar - glass ── */
    main { display: flex; min-width: 0; flex-direction: column; min-height: 0; position: relative; }
    .topbar {
      z-index: 2; display: flex; height: 58px; flex: 0 0 58px; align-items: center; justify-content: space-between;
      padding: 0 clamp(16px, 3.5vw, 40px);
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.42);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }
    [data-theme="dark"] .topbar { background: rgba(14,15,18,0.42); }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }
    .mobile-menu { display: none; width: 32px; height: 32px; place-items: center; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--ink-2); cursor: pointer; transition: background .15s ease; }
    .mobile-menu:hover { background: var(--surface-2); }
    .mobile-menu svg { width: 18px; height: 18px; }
    .model-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 9px;
      border: 1px solid var(--glass-border); border-radius: 999px;
      background: var(--glass-strong);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--glass-shadow);
    }
    .model-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
    .model-label { color: var(--ink); font-size: 12.5px; font-weight: 650; letter-spacing: -.01em; }
    .model-version { margin-left: 5px; color: var(--muted); font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11.5px; font-weight: 500; text-decoration: none; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .25s ease; }
    .status-dot.ready { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.16); }
    .status-dot.loading { background: #eab308; animation: pulse 1.5s ease-in-out infinite; }
    .status-dot.error { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.14); }
    .icon-link {
      display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid transparent; border-radius: 10px;
      background: transparent; color: var(--muted); cursor: pointer; text-decoration: none;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .icon-link:hover { border-color: var(--glass-border); background: var(--glass-strong); backdrop-filter: blur(12px); color: var(--ink); }
    .icon-link svg { width: 16px; height: 16px; }
    /* ── Conversation ── */
    .conversation { position: relative; display: flex; min-height: 0; flex: 1; flex-direction: column; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; scroll-behavior: smooth; }
    .content { width: min(768px, 100% - 48px); min-height: 100%; margin: 0 auto; }
    .welcome { display: flex; min-height: 100%; flex-direction: column; align-items: center; justify-content: flex-start; padding: clamp(28px, 8vh, 84px) 0 140px; text-align: center; animation: rise .5s cubic-bezier(.22,.68,0,1) both; }
    .hero-logo { display: block; width: min(400px, 82vw); height: auto; overflow: visible; color: var(--ink); margin-bottom: 14px; filter: drop-shadow(0 10px 24px rgba(20,20,25,.06)); }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
      border: 1px solid var(--glass-border); background: var(--glass-strong);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; box-shadow: var(--glass-shadow);
    }
    .hero-eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--grad); display: block; }
    .hero-title {
      margin: 6px 0 0; color: var(--ink); font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; letter-spacing: -.035em; line-height: 1.15;
      background: linear-gradient(180deg, var(--ink) 55%, color-mix(in srgb, var(--ink) 65%, var(--accent)));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-sub { margin: 10px 0 0; color: var(--muted); font-size: 13.5px; letter-spacing: .01em; max-width: 440px; line-height: 1.6; }
    .suggestions { display: grid; width: 100%; max-width: 580px; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 28px; text-align: left; }
    .suggestion {
      display: flex; flex-direction: column; gap: 4px; padding: 16px 16px 15px;
      border: 1px solid var(--glass-border); border-radius: 16px;
      background: rgba(255,255,255,0.48);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      cursor: pointer; box-shadow: var(--glass-shadow);
      opacity: .78;
      transition: transform .18s cubic-bezier(.22,.68,0,1), box-shadow .18s ease, border-color .18s ease, opacity .18s ease, background .18s ease;
      position: relative; overflow: hidden;
    }
    [data-theme="dark"] .suggestion { background: rgba(255,255,255,0.05); }
    .suggestion::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); opacity: .8; }
    .suggestion:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 35%, var(--glass-border)); box-shadow: var(--shadow-md); opacity: 1; background: var(--glass-strong); }
    .suggestion:active { transform: translateY(0); }
    .suggestion-title { color: var(--ink); font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
    .suggestion-title::before { content: ""; width: 22px; height: 22px; border-radius: 6px; background: var(--grad); opacity: .9; flex: 0 0 22px; box-shadow: 0 4px 10px rgba(79,91,213,.25); }
    .suggestion:nth-child(2) .suggestion-title::before { background: linear-gradient(135deg, #06b6d4, #4f5bd5); }
    .suggestion-desc { color: var(--muted); font-size: 12px; line-height: 1.5; padding-left: 29px; }
    /* Messages - glass */
    .messages { display: flex; flex-direction: column; gap: 26px; padding: 36px 0 40px; }
    .message { display: flex; align-items: flex-start; gap: 12px; animation: rise .32s cubic-bezier(.22,.68,0,1) both; }
    .message.user { justify-content: flex-end; }
    .avatar {
      display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; margin-top: 1px;
      border: 1px solid var(--glass-border); border-radius: 9px;
      background: var(--grad); color: #fff; font-size: 9px; font-weight: 750; letter-spacing: -.05em; padding-right: 1px;
      box-shadow: 0 6px 14px rgba(79,91,213,.28);
    }
    .message-body { min-width: 0; max-width: 86%; }
    .message.user .message-body {
      max-width: min(80%, 560px); padding: 11px 15px; border-radius: 18px 18px 6px 18px;
      background: linear-gradient(135deg, rgba(20,20,25,.92), rgba(79,91,213,.92));
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.18); color: #fff; box-shadow: 0 10px 24px rgba(20,20,25,.14);
    }
    [data-theme="dark"] .message.user .message-body { background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(139,147,255,.92)); color: #141416; }
    .message-role { margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .01em; }
    .message-text { overflow-wrap: anywhere; color: var(--ink-2); font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; }
    .message.user .message-text { color: inherit; line-height: 1.65; }
    .message-text strong { color: var(--ink); font-weight: 650; }
    .message.user .message-text strong { color: inherit; }
    .message-text em { font-style: italic; }
    .message-text a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .message-text code { padding: 2px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); color: var(--ink); font-family: var(--mono); font-size: .88em; }
    .message-text pre { margin: 12px 0; padding: 13px 15px; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); white-space: pre; }
    .message-text pre code { padding: 0; border: 0; background: none; font-size: 12.5px; line-height: 1.65; }
    .message-actions { display: flex; gap: 2px; margin-top: 7px; margin-left: -6px; }
    .icon-btn { display: grid; width: 27px; height: 26px; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; transition: background .15s ease, color .15s ease; }
    .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
    .icon-btn svg { width: 14px; height: 14px; }
    .icon-btn .i-check { display: none; color: #22c55e; }
    .icon-btn.copied .i-copy { display: none; }
    .icon-btn.copied .i-check { display: block; }
    .typing { display: inline-flex; gap: 5px; padding: 8px 0 6px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1.25s infinite ease-in-out both; }
    .typing span:nth-child(2) { animation-delay: .16s; }
    .typing span:nth-child(3) { animation-delay: .32s; }
    /* ── Composer - THE GLASS INPUT ── */
    .composer-wrap {
      z-index: 2; padding: 10px 24px 16px;
      background: linear-gradient(to top, color-mix(in srgb, var(--bg) 88%, transparent) 58%, transparent);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .composer-area { width: min(768px, 100%); margin: 0 auto; }
    .composer {
      padding: 12px 12px 8px;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--glass-shadow);
      /* Reduced opacity by default */
      opacity: .62;
      transform: translateY(0);
      transition: opacity .35s ease, border-color .25s ease, box-shadow .25s ease, transform .25s cubic-bezier(.22,.68,0,1), background .25s ease;
    }
    /* Only fully activate when user scrolls up, hovers, or focuses */
    .composer:hover { opacity: .82; }
    .composer:focus-within,
    .composer.scrolled-up,
    .composer.is-active {
      opacity: 1;
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 38%, var(--glass-border));
      background: var(--glass-strong);
      box-shadow: 0 20px 44px -16px rgba(79,91,213,.28), 0 2px 8px rgba(20,20,25,.06), 0 1px 0 rgba(255,255,255,.7) inset;
    }
    .composer textarea {
      display: block; width: 100%; min-height: 28px; max-height: 180px; resize: none;
      padding: 4px 5px; border: 0; outline: 0; background: transparent; color: var(--ink);
      font-size: 14.5px; line-height: 1.6;
    }
    .composer textarea::placeholder { color: var(--faint); }
    .composer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 1px 0; }
    .composer-hint { padding-left: 5px; color: var(--faint); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .composer-hint b { color: var(--muted); font-weight: 600; }
    .send {
      display: grid; width: 36px; height: 36px; flex: 0 0 36px; place-items: center; border: 0; border-radius: 12px;
      background: var(--grad); color: #fff; cursor: pointer;
      box-shadow: 0 8px 18px rgba(79,91,213,.35), 0 1px 0 rgba(255,255,255,.25) inset;
      transition: transform .16s cubic-bezier(.22,.68,0,1), opacity .16s ease, box-shadow .16s ease;
    }
    .send:hover:not(:disabled) { transform: translateY(-1px) scale(1.04); box-shadow: 0 10px 22px rgba(79,91,213,.42); }
    .send:active:not(:disabled) { transform: translateY(0) scale(.97); }
    .send:disabled { opacity: .32; cursor: default; box-shadow: none; }
    .send svg { width: 16px; height: 16px; }
    .fineprint { margin-top: 9px; color: var(--faint); font-size: 10.5px; text-align: center; }
    .mobile-overlay { display: none; position: fixed; inset: 0; z-index: 4; border: 0; padding: 0; background: rgba(20,20,25,.45); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .22s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 50% { opacity: .3; } }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        z-index: 5; position: fixed; top: 0; bottom: 0; left: 0; width: min(288px, 84vw); height: 100dvh;
        transform: translateX(-102%); box-shadow: 16px 0 48px rgba(0,0,0,.12);
        transition: transform .26s cubic-bezier(.22,.68,0,1);
      }
      .sidebar.open { transform: translateX(0); }
      .delete-chat { opacity: 1; }
      .mobile-overlay.open { display: block; opacity: 1; pointer-events: auto; }
      .topbar { height: 54px; flex-basis: 54px; padding: 0 12px; }
      .mobile-menu { display: grid; }
      .status { font-size: 0; gap: 0; }
      .status-dot { width: 7px; height: 7px; }
      .content { width: calc(100% - 32px); }
      .welcome { padding-top: 40px; padding-bottom: 110px; }
      .hero-logo { width: min(320px, 82vw); }
      .suggestions { grid-template-columns: 1fr; gap: 8px; margin-top: 24px; }
      .messages { gap: 22px; padding: 24px 0 28px; }
      .message-body { max-width: 92%; }
      .message.user .message-body { max-width: 88%; }
      .composer-wrap { padding: 6px 12px 10px; }
      .composer { border-radius: 18px; }
      .composer-hint { display: none; }
      .composer-bottom { justify-content: flex-end; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversation navigation">
      <a class="brand" href="/" aria-label="dgAI home">
        <span class="brand-mark">dg</span>
        <span class="brand-name">dgAI<small>Converse 1.3</small></span>
      </a>
      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New conversation
      </button>
      <div class="section-label">Recent</div>
      <div class="history" id="history"></div>
      <div class="sidebar-bottom">
        <a class="side-link" href="/docs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.8h9l5 5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4.8a1 1 0 0 1 1-1Z"/><path d="M14 4v5h5M8 13h8M8 17h8"/></svg>
          API &amp; usage
        </a>
        <div class="rail-caption">A little more human.</div>
      </div>
    </aside>
    <button class="mobile-overlay" id="mobileOverlay" type="button" aria-label="Close conversation menu"></button>
    <main>
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open conversations" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="model-pill">
            <span class="dot" aria-hidden="true"></span>
            <span class="model-label">Converse<span class="model-version">1.3</span></span>
          </div>
        </div>
        <div class="topbar-right">
          <a class="status" href="/health" aria-label="View model health details" title="View model health details">
            <span class="status-dot loading" id="statusDot"></span>
            <span id="statusText">Connecting</span>
          </a>
          <button class="icon-link" id="themeToggle" type="button" aria-label="Toggle color theme" title="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          </button>
          <a class="icon-link" href="/docs" aria-label="API and usage documentation" title="API &amp; usage">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.8h9l5 5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4.8a1 1 0 0 1 1-1Z"/><path d="M14 4v5h5M8 13h8M8 17h6"/></svg>
          </a>
        </div>
      </header>
      <section class="conversation" id="conversation" aria-live="polite">
        <div class="content" id="content"></div>
      </section>
      <div class="composer-wrap">
        <div class="composer-area">
          <form class="composer" id="chatForm">
            <textarea id="input" rows="1" placeholder="Message dgAI…" aria-label="Message dgAI"></textarea>
            <div class="composer-bottom">
              <span class="composer-hint"><b>Enter</b> to send · <b>Shift + Enter</b> for a new line · Scroll up to focus</span>
              <button class="send" id="send" type="submit" aria-label="Send message" title="Send" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
              </button>
            </div>
          </form>
          <div class="fineprint">Converse can make mistakes. Check important information.</div>
        </div>
      </div>
    </main>
  </div>
<script>
  const content = document.querySelector("#content");
  const input = document.querySelector("#input");
  const send = document.querySelector("#send");
  const historyEl = document.querySelector("#history");
  const sidebar = document.querySelector("#sidebar");
  const mobileOverlay = document.querySelector("#mobileOverlay");
  const mobileMenu = document.querySelector("#mobileMenu");
  const conversation = document.querySelector("#conversation");
  const STORAGE_KEY = "dgai-converse-sessions-v1";
  const THEME_KEY = "dgai-converse-theme";
  const THINKING = "Thinking…";
  let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let activeId = null;
  let busy = false;
  const root = document.documentElement;
  const storedTheme = localStorage.getItem(THEME_KEY);
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = storedTheme || (prefersDark ? "dark" : "light");
  document.querySelector("#themeToggle").addEventListener("click", () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    localStorage.setItem(THEME_KEY, next);
  });
  const esc = (value) => String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[char]));
  const format = (value) => {
    let html = esc(value);
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>")
               .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
               .replace(/\*([^*]+)\*/g, "<em>$1</em>")
               .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return html;
  };
  const current = () => sessions.find(session => session.id === activeId);
  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    renderHistory();
  }
  function renderWelcome() {
    content.innerHTML = `
      <div class="welcome">
        <!-- FIXED SVG LOGO -->
        <svg class="hero-logo" viewBox="0 35 340 165" role="img" aria-label="dgAI">
          <text x="8" y="160" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="148" font-weight="700" letter-spacing="-6" fill="currentColor">dgAI</text>
        </svg>
        <div class="hero-eyebrow"><i></i> Converse 1.3</div>
        <h1 class="hero-title">How can I help you today?</h1>
        <p class="hero-sub">Ask anything, brainstorm ideas, or explore a new topic — with a calmer, more focused workspace.</p>
        <div class="suggestions" id="suggestions">
          <div class="suggestion" data-prompt="Write a short story about a robot discovering music for the first time.">
            <span class="suggestion-title">Creative writing</span>
            <span class="suggestion-desc">A short story about a robot discovering music.</span>
          </div>
          <div class="suggestion" data-prompt="Explain the concept of quantum entanglement in simple terms.">
            <span class="suggestion-title">Explain a concept</span>
            <span class="suggestion-desc">Quantum entanglement in simple terms.</span>
          </div>

        </div>
      </div>`;
    document.querySelectorAll('.suggestion').forEach(el => {
      el.addEventListener('click', () => {
        input.value = el.dataset.prompt;
        input.focus();
        resizeInput();
      });
    });
  }
  function renderHistory() {
    historyEl.replaceChildren();
    if (!sessions.length) {
      const empty = document.createElement("div");
      empty.className = "history-empty";
      empty.textContent = "Your conversations will appear here.";
      historyEl.append(empty);
      return;
    }
    sessions.slice(0, 30).forEach(session => {
      const row = document.createElement("div");
      row.className = `history-row${session.id === activeId ? " active" : ""}`;
      const select = document.createElement("button");
      select.className = "history-select";
      select.type = "button";
      select.dataset.chatId = session.id;
      select.textContent = session.title || "New conversation";
      select.title = session.title || "New conversation";
      const remove = document.createElement("button");
      remove.className = "delete-chat";
      remove.type = "button";
      remove.dataset.deleteId = session.id;
      remove.setAttribute("aria-label", `Delete conversation: ${session.title || "New conversation"}`);
      remove.title = "Delete conversation";
      remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-.8 13H6.8L6 7m4 4v5m4-5v5"/></svg>';
      row.append(select, remove);
      historyEl.append(row);
    });
  }
  function renderMessages(session) {
    content.innerHTML = `<div class="messages">${session.messages.map((message, index) => `
      <article class="message ${message.role === "user" ? "user" : "assistant"}">
        ${message.role === "assistant" ? '<div class="avatar" aria-hidden="true">dg</div>' : ""}
        <div class="message-body">
          ${message.role === "assistant" ? '<div class="message-role">Converse</div>' : ""}
          <div class="message-text">${message.content === THINKING ? '<div class="typing"><span></span><span></span><span></span></div>' : format(message.content)}</div>
          ${message.role === "assistant" && message.content !== THINKING ? `<div class="message-actions">
            <button class="icon-btn copy" data-index="${index}" type="button" title="Copy response" aria-label="Copy response">
              <svg class="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
              <svg class="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
          </div>` : ""}
        </div>
      </article>`).join("")}</div>`;
    content.querySelectorAll(".copy").forEach(button => {
      button.addEventListener("click", async () => {
        const textToCopy = session.messages[Number(button.dataset.index)].content;
        try {
          await navigator.clipboard.writeText(textToCopy);
          button.classList.add("copied");
          setTimeout(() => button.classList.remove("copied"), 2000);
        } catch {}
      });
    });
    const conv = document.querySelector("#conversation");
    if (conv) conv.scrollTop = conv.scrollHeight;
  }
  function render() {
    const session = current();
    if (!session || !session.messages.length) renderWelcome();
    else renderMessages(session);
    renderHistory();
    updateSendState();
  }
  function resizeInput() {
    input.style.height = "auto";
    input.style.height = `${Math.min(input.scrollHeight, 180)}px`;
  }
  function updateSendState() {
    send.disabled = !input.value.trim() || busy;
  }
  function closeMobileMenu() {
    sidebar.classList.remove("open");
    mobileOverlay.classList.remove("open");
    mobileMenu.setAttribute("aria-expanded", "false");
  }
  document.querySelector("#newChat").addEventListener("click", () => {
    activeId = null;
    render();
    closeMobileMenu();
    input.focus();
  });
  mobileMenu.addEventListener("click", () => {
    sidebar.classList.add("open");
    mobileOverlay.classList.add("open");
    mobileMenu.setAttribute("aria-expanded", "true");
  });
  mobileOverlay.addEventListener("click", closeMobileMenu);
  historyEl.addEventListener("click", event => {
    const removeButton = event.target.closest("[data-delete-id]");
    if (removeButton) {
      const id = removeButton.dataset.deleteId;
      const session = sessions.find(item => item.id === id);
      if (!session || !window.confirm(`Delete "${session.title || "New conversation"}"? This cannot be undone.`)) return;
      sessions = sessions.filter(item => item.id !== id);
      if (activeId === id) activeId = null;
      persist();
      render();
      return;
    }
    const selectButton = event.target.closest("[data-chat-id]");
    if (selectButton) {
      activeId = selectButton.dataset.chatId;
      render();
      closeMobileMenu();
    }
  });
  input.addEventListener("input", () => {
    resizeInput();
    updateSendState();
  });
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      document.querySelector("#chatForm").requestSubmit();
    }
  });
  document.querySelector("#chatForm").addEventListener("submit", async event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    if (!current()) {
      activeId = crypto.randomUUID();
      sessions.unshift({ id: activeId, title: text.slice(0, 42), messages: [] });
    }
    const session = current();
    session.messages.push({ role: "user", content: text });
    input.value = "";
    resizeInput();
    busy = true;
    updateSendState();
    session.messages.push({ role: "assistant", content: THINKING });
    render();
    try {
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "converse-1.3",
          messages: session.messages.slice(0, -1).map(message => ({ role: message.role, content: message.content })),
          max_tokens: 512
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || "The model is not available yet.");
      session.messages.at(-1).content = data.choices?.[0]?.message?.content || "I couldn't produce a response. Please try again.";
    } catch (error) {
      session.messages.at(-1).content = error.message;
    } finally {
      busy = false;
      persist();
      render();
      updateSendState();
      input.focus();
    }
  });
  async function checkHealth() {
    try {
      const response = await fetch("/health");
      const data = await response.json();
      const dot = document.querySelector("#statusDot");
      const status = data.status === "ready" ? "ready" : data.status === "loading" ? "loading" : "error";
      dot.className = `status-dot ${status}`;
      document.querySelector("#statusText").textContent = status === "ready" ? "Ready" : status === "loading" ? "Warming up" : "Unavailable";
      if (status !== "ready" && status !== "error") setTimeout(checkHealth, 12000);
      else if (status === "error") setTimeout(checkHealth, 30000);
    } catch {
      document.querySelector("#statusText").textContent = "Connecting";
      setTimeout(checkHealth, 12000);
    }
  }
  // Composer stays translucent until user scrolls up / focuses
  const composerEl = document.querySelector(".composer");
  const convoEl = document.querySelector("#conversation");
  function updateComposerState() {
    if (!composerEl || !convoEl) return;
    const scrolledUp = convoEl.scrollTop < convoEl.scrollHeight - convoEl.clientHeight - 120;
    composerEl.classList.toggle("scrolled-up", scrolledUp);
  }
  if (convoEl) convoEl.addEventListener("scroll", updateComposerState, { passive: true });
  if (input) {
    input.addEventListener("focus", () => composerEl && composerEl.classList.add("is-active"));
    input.addEventListener("blur", () => composerEl && composerEl.classList.remove("is-active"));
  }
  // initial state
  setTimeout(updateComposerState, 100);
  render();
  checkHealth();
</script>
</body>
</html>
